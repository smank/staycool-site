name = "cartridge-fulfillment"
main = "src/worker.js"
compatibility_date = "2026-05-27"

# Secrets (set with `wrangler secret put NAME`, never commit):
#   LS_WEBHOOK_SECRET  LICENSE_PRIVATE_KEY  RESEND_API_KEY

[vars]
# Public half of the licence signing key (safe to commit — it also ships inside
# the plugin binary). MUST match kPublicKey in src/License/LicenseManager.cpp.
# Production key, rotated 2026-07-31 (2048-bit).
LICENSE_PUBLIC_KEY = "11,"

# REQUIRED: activation seat lists + issued-licence ledger (hashes only, no PII).
[[kv_namespaces]]
binding = "LEDGER"
id = "589282e9d956493abdf81fdc80546be0"
